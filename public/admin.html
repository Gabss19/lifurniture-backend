<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Admin Dashboard – LiFurniture</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #FAF7F2; color: #2C1A0E; }

  .topbar {
    background: #2C1A0E; padding: 16px 24px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .topbar h1 { color: #F5EFE6; font-size: 1.1rem; font-weight: 300; }
  .topbar h1 span { color: #D4894A; font-style: italic; }

  .main { padding: 20px; max-width: 1100px; margin: 0 auto; }

  .stats-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 20px;
  }
  .stat-card {
    background: white; border-radius: 12px; padding: 16px;
    border: 1px solid rgba(44,26,14,0.08);
  }
  .stat-card .label {
    font-size: 0.65rem; letter-spacing: 0.12em;
    text-transform: uppercase; color: #A89880; margin-bottom: 6px;
  }
  .stat-card .num { font-size: 1.6rem; font-weight: 300; color: #2C1A0E; }

  .refresh-btn {
    padding: 10px 20px; background: #2C1A0E; color: #F5EFE6;
    border: none; border-radius: 8px; font-size: 0.85rem; cursor: pointer;
    margin-bottom: 16px; width: 100%;
  }
  .refresh-btn:hover { background: #B5651D; }

  /* Desktop table */
  .table-wrap {
    background: white; border-radius: 12px;
    overflow: hidden; border: 1px solid rgba(44,26,14,0.08);
  }
  table { width: 100%; border-collapse: collapse; }
  thead th {
    background: #2C1A0E; color: #F5EFE6;
    padding: 12px 14px; font-size: 0.65rem; letter-spacing: 0.1em;
    text-transform: uppercase; text-align: left;
  }
  tbody tr { border-bottom: 1px solid rgba(44,26,14,0.06); }
  tbody tr:hover { background: #F0EBE3; }
  td { padding: 12px 14px; font-size: 0.82rem; vertical-align: middle; }
  td .sub { font-size: 0.72rem; color: #A89880; margin-top: 2px; }

  .loading { text-align: center; padding: 40px; color: #A89880; }
  .empty { text-align: center; padding: 60px; color: #A89880; }

  /* Mobile cards — hidden on desktop */
  .cards-wrap { display: none; }
  .appt-card {
    background: white; border-radius: 12px; padding: 16px;
    border: 1px solid rgba(44,26,14,0.08); margin-bottom: 12px;
  }
  .appt-card .card-header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 10px;
  }
  .appt-card .card-name { font-weight: 600; font-size: 0.95rem; }
  .appt-card .card-num {
    background: #2C1A0E; color: #F5EFE6;
    border-radius: 20px; padding: 2px 10px; font-size: 0.72rem;
  }
  .appt-card .card-row {
    display: flex; gap: 8px; margin-bottom: 6px;
    font-size: 0.82rem; align-items: flex-start;
  }
  .appt-card .card-row .card-label {
    min-width: 72px; font-size: 0.65rem; text-transform: uppercase;
    letter-spacing: 0.08em; color: #A89880; padding-top: 2px;
  }
  .appt-card .card-row .card-val { color: #2C1A0E; }
  .appt-card .card-row .card-sub { font-size: 0.72rem; color: #A89880; }

  /* Responsive breakpoints */
  @media (max-width: 700px) {
    .stats-row { grid-template-columns: 1fr 1fr; }
    .stats-row .stat-card:last-child { grid-column: span 2; }
    .stat-card .num { font-size: 1.3rem; }

    /* Hide table, show cards */
    .table-wrap { display: none; }
    .cards-wrap { display: block; }
  }

  @media (max-width: 400px) {
    .stats-row { grid-template-columns: 1fr; }
    .stats-row .stat-card:last-child { grid-column: span 1; }
    .topbar h1 { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div class="topbar">
  <h1>Li<span>Furniture</span> — Admin</h1>
</div>

<div class="main">
  <div class="stats-row">
    <div class="stat-card">
      <div class="label">Total Appointments</div>
      <div class="num" id="statTotal">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Latest Submission</div>
      <div class="num" id="statLatest" style="font-size:0.95rem; padding-top:4px;">—</div>
    </div>
    <div class="stat-card">
      <div class="label">Status</div>
      <div class="num" style="color:#2d7a45; font-size:0.95rem; padding-top:4px;">● Live</div>
    </div>
  </div>

  <button class="refresh-btn" onclick="loadAppointments()">↻ Refresh</button>

  <!-- Desktop table -->
  <div class="table-wrap">
    <div class="loading" id="loading">Loading appointments…</div>
    <table id="apptTable" style="display:none;">
      <thead>
        <tr>
          <th>#</th>
          <th>Name</th>
          <th>Contact</th>
          <th>Address</th>
          <th>Project</th>
          <th>Schedule</th>
          <th>Submitted</th>
          <th>Status</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="apptBody"></tbody>
    </table>
    <div class="empty" id="emptyState" style="display:none;">No appointments yet.</div>
  </div>

  <!-- Mobile cards -->
  <div class="cards-wrap" id="cardsWrap"></div>
</div>

<script>
// ── Bug #4 Fix: redirect to login.html instead of using prompt() ──
async function checkAdminAccess() {
  if (sessionStorage.getItem('li_admin_auth') === 'true') {
    loadAppointments();
    return;
  }
  window.location.replace('login.html');
}

const serviceLabels = {
  cabinets: 'Custom Cabinets', drawers: 'Drawer Units',
  storage: 'Built-in Storage', kitchen: 'Kitchen Cabinets',
  combo: 'Multiple/Combo', other: 'Other'
};
const timeLabels = {
  morning: 'Morning (8AM–12PM)',
  afternoon: 'Afternoon (1PM–5PM)'
};

async function updateStatus(id, newStatus, selectElement) {
  selectElement.style.opacity = '0.5';
  try {
    const res = await fetch(`/api/appointments/${id}/status`, {
      method: 'PUT',
      headers: {
        'Content-Type': 'application/json',
        'x-admin-token': sessionStorage.getItem('li_admin_auth_token')
      },
      body: JSON.stringify({ status: newStatus })
    });

    if (res.ok) {
      updateSelectColor(selectElement, newStatus);
    } else {
      alert('Failed to save updated status.');
    }
  } catch (err) {
    alert('Connection error updating status.');
  } finally {
    selectElement.style.opacity = '1';
  }
}

function updateSelectColor(el, status) {
  if (!el) return;
  if (status === 'Pending')        { el.style.background = '#fff3cd'; el.style.color = '#856404'; el.style.borderColor = '#ffeeba'; }
  else if (status === 'Confirmed') { el.style.background = '#d4edda'; el.style.color = '#155724'; el.style.borderColor = '#c3e6cb'; }
  else if (status === 'Completed') { el.style.background = '#e2e3e5'; el.style.color = '#383d41'; el.style.borderColor = '#d6d8db'; }
}

async function deleteAppointment(id) {
  if (!confirm('Are you sure you want to delete this appointment?')) return;

  try {
    const res = await fetch(`/api/appointments/${id}`, {
      method: 'DELETE',
      headers: { 'x-admin-token': sessionStorage.getItem('li_admin_auth_token') }
    });
    if (res.ok) {
      alert('Deleted successfully!');
      loadAppointments();
    } else {
      alert('Failed to delete.');
    }
  } catch (err) {
    alert('Error connecting to server.');
  }
}

async function loadAppointments() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('apptTable').style.display = 'none';
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('cardsWrap').innerHTML = '';

  try {
    const res = await fetch('/api/appointments', {
      headers: { 'x-admin-token': sessionStorage.getItem('li_admin_auth_token') }
    });

    if (!res.ok) {
      document.getElementById('loading').textContent = `❌ Server returned ${res.status}. Check your backend.`;
      return;
    }

    // ── Bug #1 Fix: server now returns { appointments, total } not a plain array ──
    const json = await res.json();
    const data = json.appointments;

    document.getElementById('loading').style.display = 'none';
    document.getElementById('statTotal').textContent = json.total;

    if (!data || data.length === 0) {
      document.getElementById('emptyState').style.display = 'block';
      document.getElementById('statLatest').textContent = '—';
      return;
    }

    if (data[0] && data[0].createdAt) {
      const latest = new Date(data[0].createdAt);
      document.getElementById('statLatest').textContent =
        latest.toLocaleDateString('en-PH', { month: 'short', day: 'numeric', year: 'numeric' });
    } else {
      document.getElementById('statLatest').textContent = '—';
    }

    const tbody = document.getElementById('apptBody');
    tbody.innerHTML = '';
    const cardsWrap = document.getElementById('cardsWrap');

    // ── Bug #3 Fix: header is now hardcoded in HTML — no dynamic rewrite needed ──

    data.forEach((a, i) => {
      const submitted = a.createdAt ? new Date(a.createdAt).toLocaleDateString('en-PH', {
        month: 'short', day: 'numeric', year: 'numeric'
      }) : '—';

      const currentStatus = a.status || 'Pending';

      const statusSelectHTML = `
        <select onchange="updateStatus('${a._id}', this.value, this)" style="padding:4px 8px; border-radius:4px; font-weight:bold; font-size:0.85rem; cursor:pointer; border:1px solid;">
          <option value="Pending"   ${currentStatus === 'Pending'   ? 'selected' : ''}>⏳ Pending</option>
          <option value="Confirmed" ${currentStatus === 'Confirmed' ? 'selected' : ''}>✅ Confirmed</option>
          <option value="Completed" ${currentStatus === 'Completed' ? 'selected' : ''}>💼 Completed</option>
        </select>
      `;

      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${i + 1}</td>
        <td><strong>${a.firstName} ${a.lastName}</strong></td>
        <td>
          <div>${a.phone}</div>
          <div class="sub">${a.email}</div>
        </td>
        <td>${a.address}</td>
        <td>
          <div>${serviceLabels[a.service] || a.service}</div>
          <div class="sub">${a.budget || '—'}</div>
        </td>
        <td>
          <div>${a.prefDate}</div>
          <div class="sub">${timeLabels[a.prefTime] || a.prefTime}</div>
        </td>
        <td>${submitted}</td>
        <td>${statusSelectHTML}</td>
        <td><button style="color:red; cursor:pointer; background:none; border:none; text-decoration:underline;" onclick="deleteAppointment('${a._id}')">🗑 Delete</button></td>
      `;
      tbody.appendChild(tr);
      updateSelectColor(tr.querySelector('select'), currentStatus);

      const card = document.createElement('div');
      card.className = 'appt-card';
      card.innerHTML = `
        <div class="card-header">
          <div class="card-name">${a.firstName} ${a.lastName}</div>
          <div class="card-num">#${i + 1}</div>
        </div>
        <div class="card-row"><div class="card-label">Phone</div><div class="card-val">${a.phone}</div></div>
        <div class="card-row"><div class="card-label">Email</div><div class="card-val">${a.email}</div></div>
        <div class="card-row"><div class="card-label">Address</div><div class="card-val">${a.address}</div></div>
        <div class="card-row">
          <div class="card-label">Project</div>
          <div class="card-val">${serviceLabels[a.service] || a.service}<div class="card-sub">${a.budget || '—'}</div></div>
        </div>
        <div class="card-row">
          <div class="card-label">Schedule</div>
          <div class="card-val">${a.prefDate}<div class="card-sub">${timeLabels[a.prefTime] || a.prefTime}</div></div>
        </div>
        <div class="card-row"><div class="card-label">Submitted</div><div class="card-val">${submitted}</div></div>
        <div class="card-row" style="padding-top:10px; border-top:1px dashed #eee; align-items:center;">
          <div class="card-label">Manage Status</div>
          <div class="card-val">${statusSelectHTML}</div>
        </div>
        <div style="text-align:right; padding-top:10px;">
          <button style="color:red; cursor:pointer; background:none; border:none; font-size:0.85rem;" onclick="deleteAppointment('${a._id}')">🗑 Delete Record</button>
        </div>
      `;
      cardsWrap.appendChild(card);
      updateSelectColor(card.querySelector('select'), currentStatus);
    });

    document.getElementById('apptTable').style.display = 'table';

  } catch (err) {
    document.getElementById('loading').textContent = '❌ Failed to connect to dashboard infrastructure. Is your Render server running?';
  }
}

checkAdminAccess();
</script>

</body>
</html>
